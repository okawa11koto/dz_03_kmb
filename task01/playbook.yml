- hosts: localhost
  become: yes

  tasks:
    - name: Install nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Create files folder
      file:
        path: /var/www/files
        state: directory
        mode: '0755'

    - name: Add sample file a.txt
      copy:
        content: "file a"
        dest: /var/www/files/a.txt

    - name: Add sample file b.txt
      copy:
        content: "file b"
        dest: /var/www/files/b.txt

    - name: Deploy nginx config
      template:
        src: nginx-files.conf.j2
        dest: /etc/nginx/sites-available/files

    - name: Enable config
      file:
        src: /etc/nginx/sites-available/files
        dest: /etc/nginx/sites-enabled/files
        state: link
        force: yes

    - name: Remove default site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Restart nginx
      service:
        name: nginx
        state: restarted
